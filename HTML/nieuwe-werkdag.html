<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodCO2gether</title>

    <link rel="stylesheet" href="../CSS/index.css">
</head>
<body>
    <header>
        <div>
            GoodCO2gether
        </div>
         <nav>
            <a href="index.html">Home</a>
            <a href="nieuwe-werkdag.html">Nieuwe werkdag</a>
            <a href="historie.html">Mijn historie</a>
            <a href="voetafdruk.html">Mijn footprint</a>
            <a href="gegevens.html">Mijn gegevens</a>
        </nav>
    </header>

    <main>
    <h1>Nieuwe werkdag</h1>

    <form>
        <p>
            <label for="datum">Datum:</label>
            <input type="date" id="datum">
            <button type="button">Vandaag</button>
        </p>

        <p>
            <label for="werklocatie">Basis werklocatie:</label>
            <select id="werklocatie">
                <option>Kies een werklocatie</option>
                <option>Hoofdkantoor</option>
                <option>Thuis</option>
                <option>Klantlocatie</option>
            </select>
        </p>

        <p>
            <label for="blikjes">Aantal blikjes op HQ:</label>
            <input type="number" id="blikjes">
        </p>

        <p>
            <label for="schermen">Aantal beeldschermen:</label>
            <input type="number" id="schermen">
        </p>

        <p>
            <label for="uren">Aantal uren actieve schermen:</label>
            <input type="number" id="uren" step="0.1">
        </p>

        <p>
            <label for="ai">Aantal AI verzoeken:</label>
            <input type="number" id="ai">
        </p>

        <h2>Ritten toevoegen</h2>

        <p>
            <button type="button">+ Voeg rit toe</button>
        </p>

        <button type="submit">Voer werkdag in</button>
    </form>
</main>

    <footer>
        <article>

            <span>Disclaimer</span>

    </footer>

    <script></script>
</body>

</html>

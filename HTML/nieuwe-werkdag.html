<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoodCO2gether - Nieuwe werkdag</title>

    <link rel="stylesheet" href="css/index.css">
</head>
<script src="js/script.js"></script>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">

            <a href="index.html" class="logo">
                GoodCO2<span>gether</span>
            </a>

            <nav class="navigation">
                <a href="index.html">Home</a>
                <a href="nieuwe-werkdag.html" class="active">Nieuwe werkdag</a>
                <a href="historie.html">Mijn historie</a>
                <a href="voetafdruk.html">Mijn voetafdruk</a>
                <a href="gegevens.html">Mijn gegevens</a>
            </nav>

        </div>
    </header>


    <!-- MAIN -->
    <main class="container">

        <section class="page-header">

            <p class="small-title">MIJN WERKDAG</p>

            <h1>Nieuwe werkdag</h1>

            <p>
                Vul hieronder je woon-werkrit in.
                Zo kunnen we jouw CO₂-uitstoot berekenen.
            </p>

        </section>


        <section class="form-card">

            <form>

                <!-- DATUM -->
                <div class="form-group">

                    <label for="datum">
                        Datum
                    </label>

                    <input
                        type="date"
                        id="datum"
                        name="datum"
                        required
                    >

                </div>


                <!-- VERVOERSMIDDEL -->
                <div class="form-group">

                    <label for="vervoer">
                        Vervoersmiddel
                    </label>

                    <select id="vervoer" name="vervoer" required>

                        <option value="">
                            Kies een vervoersmiddel
                        </option>

                        <option value="fiets">
                            Fiets
                        </option>

                        <option value="lopen">
                            Lopend
                        </option>

                        <option value="ov">
                            Openbaar vervoer
                        </option>

                        <option value="auto">
                            Auto
                        </option>

                        <option value="motor">
                            Motor
                        </option>

                    </select>

                </div>


                <!-- AFSTAND -->
                <div class="form-group">

                    <label for="afstand">
                        Afstand enkele reis (km)
                    </label>

                    <input
                        type="number"
                        id="afstand"
                        name="afstand"
                        min="0"
                        step="0.1"
                        placeholder="Bijvoorbeeld 12.5"
                        required
                    >

                    <span class="form-help">
                        Vul de afstand van je woning naar je werk in.
                    </span>

                </div>


                <!-- RETOUR -->
                <div class="form-group">

                    <label for="retour">
                        Retourrit
                    </label>

                    <select id="retour" name="retour">

                        <option value="ja">
                            Ja, heen en terug
                        </option>

                        <option value="nee">
                            Nee, alleen enkele reis
                        </option>

                    </select>

                </div>


                <!-- KNOP -->
                <button
                    type="submit"
                    class="button button-green"
                >
                    Werkdag opslaan
                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container footer-content">

            <span>© 2026 GoodCO2gether</span>

            <div>
                <a href="#">Disclaimer</a>
                <a href="#">Privacy</a>
            </div>

        </div>

    </footer>

</body>
</html>

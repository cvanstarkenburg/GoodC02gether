<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodCO2gether</title>
    <link rel="icon" type="image/png" href="../images/FaviconGCO2.png">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/nieuwe-werkdag.css">
    <script src="../JS/script.js" defer></script>
    <script src="../JS/nieuwe-werkdag.js" defer></script>
</head>

<body>
    <div id="succes-toast" class="toast" role="status" aria-live="polite">
        <span class="toast-icoon" aria-hidden="true">✓</span>
        <span>Werkdag succesvol opgeslagen</span>
    </div>

    <header id="site-header">
        <div class="header-logo-container">
            <img src="../images/FaviconGCO2.png" alt="GoodCO2gether logo" class="header-logo">
            <span>GoodCO2gether</span>
        </div>

        <nav id="main-navigation">
            <a href="#" id="home-button">Home</a>
            <a href="#" id="werkdag-button">Nieuwe werkdag</a>
            <a href="#" id="historie-button">Mijn historie</a>
            <a href="#" id="footprint-button">Mijn footprint</a>
            <a href="#" id="gegevens-button">Mijn gegevens</a>
        </nav>

        <button
            id="header-toggle"
            class="header-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="main-navigation">
            Menu
            <span class="header-toggle-icoon" aria-hidden="true">▾</span>
        </button>
    </header>

    <main>
        <h1>Nieuwe werkdag</h1>

        <form id="werkdag-formulier" novalidate>
            <div class="form-groep">
                <label for="datum">Datum:</label>
                <input
                    type="date"
                    id="datum"
                    name="datum"
                    required>
                <small class="foutmelding" id="datum-fout"></small>
                <button type="button" id="vandaag-knop">Vandaag</button>
            </div>

            <div class="form-groep">
                <label for="werklocatie">Basis werklocatie:</label>
                <select id="werklocatie" name="werklocatie" required>
                    <option value="">Kies een werklocatie</option>
                    <option value="hoofdkantoor">Hoofdkantoor</option>
                    <option value="thuis">Thuis</option>
                    <option value="klantlocatie">Klantlocatie</option>
                </select>
                <small class="foutmelding" id="werklocatie-fout"></small>
            </div>

            <div class="form-groep">
                <label for="blikjes">Aantal blikjes op HQ:</label>
                <input
                    type="number"
                    id="blikjes"
                    name="blikjes"
                    min="0"
                    step="1"
                    required>
                <small class="foutmelding" id="blikjes-fout"></small>
            </div>

            <div class="form-groep">
                <label for="schermen">Aantal beeldschermen:</label>
                <input
                    type="number"
                    id="schermen"
                    name="schermen"
                    min="0"
                    step="1"
                    required>
                <small class="foutmelding" id="schermen-fout"></small>
            </div>

            <div class="form-groep">
                <label for="uren">Aantal uren actieve schermen:</label>
                <input
                    type="number"
                    id="uren"
                    name="uren"
                    min="0"
                    step="0.1"
                    required>
                <small class="foutmelding" id="uren-fout"></small>
            </div>

            <div class="form-groep">
                <label for="ai">Aantal AI verzoeken:</label>
                <input
                    type="number"
                    id="ai"
                    name="ai"
                    min="0"
                    step="1"
                    required>
                <small class="foutmelding" id="ai-fout"></small>
            </div>

            <h2>Ritten toevoegen</h2>

            <div class="form-groep">
                <button type="button" id="rit-toevoegen-knop">+ Voeg rit toe</button>
            </div>

            <button type="submit" id="werkdag-invoeren-knop">Voer werkdag in</button>
        </form>

        <dialog id="rit-popup" class="rit-popup" aria-labelledby="rit-popup-titel">
            <form id="rit-formulier" novalidate>
                <h2 id="rit-popup-titel">Rit toevoegen</h2>

                <div class="form-groep">
                    <label for="vervoersmiddel">Vervoersmiddel:</label>
                    <select id="vervoersmiddel" name="vervoersmiddel" required>
                        <option value="">Kies een vervoersmiddel</option>
                        <option value="auto">Auto</option>
                        <option value="openbaar-vervoer">Openbaar vervoer</option>
                    </select>
                    <small class="foutmelding" id="vervoersmiddel-fout"></small>
                </div>

                <div class="form-groep">
                    <input type="checkbox" id="retour" name="retour">
                    <label for="retour">Retour</label>
                </div>

                <button type="button" id="rit-annuleren-knop">Annuleren</button>
                <button type="submit">Toevoegen</button>
            </form>
        </dialog>
    </main>

    <footer>
        <article>
            <span>© 2024 Goodzo B.V.</span>
            <span>Vacatures bij Goodzo B.V.</span>
            <span>Disclaimer</span>
        </article>
    </footer>
</body>

</html>
